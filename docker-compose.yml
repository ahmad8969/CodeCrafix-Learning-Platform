services:
  mongo:
    image: mongo:7
    container_name: codecrafters-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codecrafters-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/codecrafters
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_local_access_secret_change_me_32}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_local_refresh_secret_change_me_32}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: codecrafters-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo_data:
  api_uploads:
